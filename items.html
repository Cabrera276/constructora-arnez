<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Gestión de Proyecto</title>

<link rel="stylesheet"
href="styles.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body>

<!-- HEADER -->

<header class="header">

<nav class="navbar">

<div class="logo">

<img
src="Imagenes/LOGO_ARNEZ_CAMACHO-removebg-preview.png"
alt="Logo">

</div>

<ul class="menu">

<li>
<a href="inicio.html">
INICIO
</a>
</li>

<li>
<a href="datos.html">
DATOS DEL<br> PROYECTO
</a>
</li>

<li>
<a href="items.html"
class="active">
ITEMS
</a>
</li>

<li>
<a href="plantillas.html">
PLANILLAS
</a>
</li>

<li>
<a href="plazos.html">
AMPLIACIONES <br>DE PLAZO
</a>
</li>

</ul>

<button class="contact-btn">

<i class="fa fa-phone"></i>

Contactos

</button>

</nav>

</header>

<!-- BOTONES -->

<div class="actions">

<button id="btnModulo">

<i class="fa fa-folder"></i>

Añadir Modulo

</button>

<button id="btnItem">

<i class="fa fa-list"></i>

Añadir Ítem

</button>

<button id="btnOC">

<i class="fa fa-share"></i>

Añadir Orden Cambio

</button>

<button id="btnCM">

<i class="fa fa-file-contract"></i>

Añadir Contrato Mod.

</button>

<button
id="btnEliminarOC"
onclick="eliminarOC()">

🗑 Eliminar OC

</button>

<button
id="btnEliminarCM"
onclick="eliminarCM()">

🗑 Eliminar CM

</button>


</div>

<!-- TABLA -->

<section class="table-container">

<table>

<thead>

<tr id="filaPrincipal">

<th rowspan="2">
MODULO
</th>

<th rowspan="2">
DESCRIPCIÓN
</th>

<th rowspan="2">
UNID.
</th>

<th colspan="3">
CONTRATO ORIGINAL
</th>

<th rowspan="2">
% INCIDENCIA
</th>

<th rowspan="2">
EVIDENCIA
</th>

<th rowspan="2">
ACCIONES
</th>

</tr>

<tr id="filaSecundaria">

<th>CANT.</th>

<th>P.U.Bs</th>

<th>TOTAL</th>

</tr>

</thead>

<tbody id="tablaItems">
</tbody>

<tfoot>

<tr>

<td colspan="5">

<strong>
TOTAL CONTRATO
</strong>

</td>

<td>0</td>

<td colspan="3"></td>

</tr>

</tfoot>

</table>

</section>


<div class="guardar-container">

<button id="btnGuardar">
<i class="fa fa-save"></i>
Guardar Datos
</button>

</div>

<!-- MODAL CONFIRMACION -->

<div
class="confirm-modal"
id="confirmModal">

<div class="confirm-box">

<h2 id="confirmTitle">
Confirmación
</h2>

<p id="confirmText">
¿Seguro?
</p>

<div class="confirm-actions">

<button id="cancelBtn">
Cancelar
</button>

<button id="acceptBtn">
Eliminar
</button>

</div>

</div>

</div>

<!-- MODAL IMAGEN -->

<div
class="image-modal"
id="modalImagen">

<div class="image-box">

<button
class="close-image"
onclick="cerrarImagen()">

✖

</button>

<img id="imgPreview">

<p id="imgDescripcion"></p>

</div>

</div>

<script src="script.js"></script>

</body>
</html>
